name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

  # Clase 12: las operaciones de socio (reservar, cancelar, escanear) corren en
  # una transacción SERIALIZABLE. Sus garantías de concurrencia (último cupo,
  # solapamiento, doble escaneo) solo se pueden probar contra un PostgreSQL de
  # verdad: este job levanta uno vacío y descartable, aplica las migraciones y
  # corre lib/db/operaciones.integration.test.ts. No usa ninguna credencial ni
  # dato de producción.
  integracion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pulso
          POSTGRES_PASSWORD: pulso
          POSTGRES_DB: pulso_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulso -d pulso_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://pulso:pulso@localhost:5432/pulso_test
      DIRECT_URL: postgresql://pulso:pulso@localhost:5432/pulso_test
      TEST_DATABASE_URL: postgresql://pulso:pulso@localhost:5432/pulso_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Aplicar migraciones a la base de prueba
        run: npx prisma migrate deploy

      - name: Tests de integración (concurrencia incluida)
        run: npx vitest run lib/db/operaciones.integration.test.ts --reporter=default --reporter=json --outputFile=integracion.json

      # Si TEST_DATABASE_URL no llegara, el archivo se saltea entero y vitest
      # igual termina en verde. Este paso hace fallar el job en ese caso.
      - name: Confirmar que los tests corrieron y ninguno se salteó
        run: |
          node -e '
            const r = require("./integracion.json");
            console.log(`pasaron ${r.numPassedTests}, fallaron ${r.numFailedTests}, salteados ${r.numPendingTests + r.numTodoTests}`);
            if (r.numPassedTests === 0 || r.numFailedTests > 0 || r.numPendingTests + r.numTodoTests > 0) process.exit(1);
          '

      # Los datos de la demo se cargan a mano contra la base real; acá se
      # prueba en la base descartable que el script corre y que correrlo dos
      # veces no duplica nada: cuenta clases, reservas y membresías después de
      # cada corrida y exige que sean iguales.
      - name: Seed y datos de demo corren (dos veces, sin duplicar)
        env:
          DEMO_SOCIO_EMAIL: socio-demo@ejemplo.com
        run: |
          set -o pipefail
          cat > contar.cjs <<'JS'
          const { PrismaClient } = require("@prisma/client");
          const p = new PrismaClient();
          (async () => {
            const socio = { email: "socio-demo@ejemplo.com" };
            const conteo = {
              clases: await p.clase.count(),
              reservas: await p.reserva.count({ where: { estado: "CONFIRMADA" } }),
              membresias: await p.membresia.count(),
              activasDelSocio: await p.membresia.count({ where: { estado: "ACTIVA", fechaFin: { gt: new Date() }, socio } }),
              abiertasDelSocio: await p.visita.count({ where: { estado: "ABIERTA", socio } }),
            };
            // La clase del último cupo: tiene que quedar 6 de cupo y 5 reservas.
            const ultimo = await p.clase.findFirst({ where: { nombre: "Spinning", cupoMaximo: 6 }, include: { reservas: { where: { estado: "CONFIRMADA" } } } });
            conteo.ultimoCupo = ultimo ? `${ultimo.reservas.length}/${ultimo.cupoMaximo}` : null;
            if (process.argv[2] === "ensayo" && ultimo) {
              // Simula un ensayo: el socio de la demo ya tomó el último lugar.
              const s = await p.user.findUnique({ where: socio });
              await p.reserva.create({ data: { socioId: s.id, claseId: ultimo.id } });
            }
            console.log(JSON.stringify(conteo));
            await p.$disconnect();
          })();
          JS
          npm run db:seed
          npm run db:demo
          node contar.cjs ensayo > primera.json
          npm run db:demo | tee demo.log
          node contar.cjs > segunda.json
          node -e '
            const a = require("./primera.json"), b = require("./segunda.json");
            console.log({ primera: a, segunda: b });
            if (JSON.stringify(a) !== JSON.stringify(b)) { console.error("La segunda corrida cambió los conteos: duplica datos."); process.exit(1); }
            if (b.activasDelSocio !== 1 || b.abiertasDelSocio !== 0 || b.ultimoCupo !== "5/6") process.exit(1);
          '
          grep -q "Socio de la demo listo" demo.log
